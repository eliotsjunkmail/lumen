<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#06100c" />
    <title>Lumen</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306100c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c6ff4a'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <div id="app">
      <section id="gate" class="gate" aria-label="Enter Lumen">
        <div class="gate-atmosphere" aria-hidden="true"></div>
        <div class="gate-copy">
          <p class="brand">Lumen</p>
          <h1 class="headline">Watch videos in the world around you.</h1>
          <p class="support">
            Point your camera. Videos float in AR space — look, aim, and tap to watch.
          </p>
          <div class="cta-row">
            <button type="button" id="enter-btn" class="cta">Open lens</button>
          </div>
        </div>
      </section>

      <section id="field" class="field" hidden aria-label="AR video field">
        <video
          id="cam"
          class="cam"
          playsinline
          webkit-playsinline
          muted
          autoplay
        ></video>
        <canvas id="stage" class="stage"></canvas>

        <header class="hud-top">
          <p class="hud-brand">Lumen</p>
          <p class="hud-hint" id="hud-hint">Look around to find videos</p>
        </header>

        <div class="radar" id="radar" aria-hidden="true">
          <div class="radar-ring"></div>
          <div class="radar-ring radar-ring--mid"></div>
          <div class="radar-you"></div>
          <div class="radar-dots" id="radar-dots"></div>
        </div>

        <div class="aim" id="aim" aria-hidden="true">
          <span class="aim-corner aim-tl"></span>
          <span class="aim-corner aim-tr"></span>
          <span class="aim-corner aim-bl"></span>
          <span class="aim-corner aim-br"></span>
        </div>

        <footer class="hud-bottom">
          <p class="watch-label" id="focus-label">Scan the field</p>
          <button type="button" id="watch-btn" class="watch-btn" disabled>
            Watch
          </button>
        </footer>

        <div id="theater" class="theater" hidden>
          <div class="theater-panel">
            <div class="theater-meta">
              <p class="theater-brand">Lumen</p>
              <p class="theater-title" id="theater-title">Untitled</p>
            </div>
            <div class="theater-screen-wrap">
              <video id="theater-video" class="theater-video" playsinline controls></video>
            </div>
            <div class="theater-actions">
              <button type="button" id="close-theater" class="ghost-btn">Back to field</button>
            </div>
          </div>
        </div>

        <p id="status" class="status" role="status"></p>
      </section>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
    <script type="module" src="app.js?v=3"></script>
  </body>
</html>
